<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Norian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080E;--surf:#0E1019;--surf2:#13161F;
  --b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.14);
  --txt:#EFF1FA;--mu:rgba(190,200,228,.58);--mu2:rgba(190,200,228,.35);
  --moon:#7B9BFF;--moon2:#AABFFF;--feed:#FF8FAB;--feed2:#FFB3C6;
  --food:#F4C95D;--food2:#FFE49A;--gold:#C8A86C;--grn:#4EC9A0;--orn:#FF9A5C;
  --navH:68px;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --maxW:660px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;-webkit-tap-highlight-color:transparent;}

.wrap{max-width:var(--maxW);margin:0 auto;padding:0 14px calc(var(--navH) + var(--safeB) + 28px);position:relative;z-index:1;}

/* header */
.hdr{
  position:sticky;top:0;z-index:120;margin:0 -14px;
  background:rgba(7,8,14,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--b1);padding:calc(10px + var(--safeT)) 16px 12px;
}
.hdrTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;}
.wordmark{font-family:'DM Serif Display',serif;font-size:24px;background:linear-gradient(100deg,var(--moon2) 0%,var(--feed) 52%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hdrPill{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:rgba(78,201,160,.11);border:1px solid rgba(78,201,160,.20);color:var(--grn);}
.statRow{display:grid;grid-template-columns:1fr;gap:9px;}
.stat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--b2);background:rgba(255,255,255,.04);min-width:0;}
.statDot{width:10px;height:10px;border-radius:99px;flex-shrink:0;box-shadow:0 0 14px currentColor;}
.statDot.sl{background:var(--moon);}
.statDot.fe{background:var(--feed);}
.statDot.fo{background:var(--food);}
.statInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.statLbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu2);}
.statVal{font-size:16px;font-weight:700;color:var(--txt);line-height:1.25;white-space:normal;overflow:visible;word-break:normal;}

/* hero */
.hero{margin-top:12px;border-radius:26px;border:1px solid var(--b2);background:linear-gradient(145deg,rgba(123,155,255,.13),rgba(255,143,171,.08) 55%,rgba(200,168,108,.07));position:relative;overflow:hidden;padding:18px;}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 55% at 5% -5%,rgba(123,155,255,.20),transparent 55%),radial-gradient(ellipse 55% 40% at 95% 105%,rgba(255,143,171,.15),transparent 55%);}
.heroIn{position:relative;z-index:1;}
.heroBRow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.heroTag{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:var(--mu);}
.heroTag.sl{border-color:rgba(123,155,255,.30);background:rgba(123,155,255,.12);color:var(--moon2);}
.heroTag.fe{border-color:rgba(255,143,171,.30);background:rgba(255,143,171,.12);color:var(--feed2);}
.liveDot{width:8px;height:8px;border-radius:99px;background:var(--grn);flex-shrink:0;box-shadow:0 0 0 0 rgba(78,201,160,.5);animation:ping 1.9s infinite;}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(78,201,160,.5);}70%{box-shadow:0 0 0 9px rgba(78,201,160,0);}100%{box-shadow:0 0 0 0 rgba(78,201,160,0);}}
.heroMain{font-family:'DM Serif Display',serif;font-size:30px;line-height:1.1;letter-spacing:-.01em;margin-bottom:5px;}
.heroSub{font-size:13px;color:var(--mu);line-height:1.5;}

/* cta row */
.ctaRow{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cta{border-radius:20px;border:1px solid var(--b2);background:rgba(255,255,255,.05);padding:13px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;position:relative;overflow:hidden;transition:transform .13s,filter .13s;min-height:70px;}
.cta:active{transform:scale(.97);filter:brightness(.95);}
.cta.sc::before{content:"";position:absolute;inset:-2px;pointer-events:none;background:radial-gradient(380px 110px at 8% 0%,rgba(123,155,255,.24),transparent);}
.cta.fc::before{content:"";position:absolute;inset:-2px;pointer-events:none;background:radial-gradient(380px 110px at 8% 0%,rgba(255,143,171,.22),transparent);}
.cta.fd::before{content:"";position:absolute;inset:-2px;pointer-events:none;background:radial-gradient(380px 110px at 8% 0%,rgba(244,201,93,.22),transparent);}
.ctaIco{width:42px;height:42px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);position:relative;z-index:1;}
.ctaTxt{flex:1;min-width:0;position:relative;z-index:1;}
.ctaTxt .lbl{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ctaTxt .sub{font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.ctaArr{font-size:15px;color:rgba(240,242,250,.40);position:relative;z-index:1;flex-shrink:0;}

/* section */
.sec{margin-top:12px;border-radius:24px;border:1px solid var(--b1);background:var(--surf);overflow:hidden;}
.secHead{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b1);background:rgba(255,255,255,.03);}
.secTitle{font-size:14px;font-weight:700;}
.secLink{font-size:13px;font-weight:600;color:var(--moon);cursor:pointer;user-select:none;}
.tabs{display:flex;border-bottom:1px solid var(--b1);background:rgba(255,255,255,.02);}
.tabBtn{flex:1;padding:10px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;user-select:none;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tabBtn.on{color:var(--txt);border-bottom-color:var(--moon);}
.tabBtn.ft.on{border-bottom-color:var(--feed);}
.tabBtn.fo.on{border-bottom-color:var(--food);}

/* list & cards */
.list{padding:11px 13px 13px;display:flex;flex-direction:column;gap:9px;}
.empty{text-align:center;padding:22px 10px;color:var(--mu);font-size:13px;}
.card{border-radius:18px;border:1px solid var(--b2);background:rgba(255,255,255,.05);padding:13px;display:flex;gap:11px;align-items:flex-start;position:relative;overflow:hidden;}
.card::after{content:"";position:absolute;inset:-2px;pointer-events:none;background:radial-gradient(450px 90px at 8% -10%,rgba(255,255,255,.06),transparent);}
.cardIco{width:40px;height:40px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);position:relative;z-index:1;}
.cardBody{flex:1;min-width:0;position:relative;z-index:1;}
.cardTitle{font-size:13px;font-weight:700;margin-bottom:3px;line-height:1.2;}
.cardDesc{font-size:12px;color:var(--mu);line-height:1.5;overflow-wrap:anywhere;}
.rowBtns{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap;}
.smBtn{padding:7px 13px;border-radius:11px;border:1px solid var(--b2);background:rgba(255,255,255,.06);color:rgba(240,242,250,.85);font-size:12px;font-weight:600;cursor:pointer;user-select:none;transition:transform .12s;min-height:34px;}
.smBtn:active{transform:scale(.96);}
.smBtn.danger{border-color:rgba(255,90,90,.22);background:rgba(255,70,70,.10);color:rgba(255,130,130,1);}
.cardMeta{font-size:11px;color:var(--mu2);flex-shrink:0;position:relative;z-index:1;white-space:nowrap;}

/* day group */
.dayGroup{border-radius:18px;border:1px solid var(--b1);background:rgba(255,255,255,.03);overflow:hidden;}
.dayHdr{padding:10px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b1);background:rgba(255,255,255,.03);}
.dayLabel{font-size:13px;font-weight:700;}
.dayMeta{display:flex;align-items:center;gap:8px;}
.dayBadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(123,155,255,.12);color:var(--moon2);border:1px solid rgba(123,155,255,.22);}
.dayBadge.fb{background:rgba(255,143,171,.10);color:var(--feed2);border-color:rgba(255,143,171,.20);}
.dayCount{font-size:11px;color:var(--mu2);}
.dayItems{padding:9px;display:flex;flex-direction:column;gap:7px;}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navH) + var(--safeB));padding:8px 12px calc(8px + var(--safeB));background:rgba(7,8,14,.90);border-top:1px solid var(--b1);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);z-index:220;}
.navIn{max-width:var(--maxW);margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-around;gap:6px;}
.navItem{flex:1;border-radius:14px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;user-select:none;color:var(--mu);min-height:48px;transition:all .14s;}
.navItem:active{transform:scale(.95);}
.navItem.on{color:var(--moon2);background:rgba(123,155,255,.10);border-color:rgba(123,155,255,.18);}
.navItem.fn.on{color:var(--feed2);background:rgba(255,143,171,.10);border-color:rgba(255,143,171,.18);}
.navItem.fo.on{color:var(--food2);background:rgba(244,201,93,.10);border-color:rgba(244,201,93,.18);}
.navIco{font-size:18px;line-height:1;}
.navLbl{font-size:10px;font-weight:700;letter-spacing:.03em;}

/* modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;padding-bottom:var(--safeB);animation:mf .18s ease-out;}
.modal.active{display:flex;align-items:flex-end;}
@keyframes mf{from{opacity:0;}to{opacity:1;}}
@keyframes mu{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet{width:100%;max-height:92vh;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + var(--safeB));background:var(--surf2);border-top:1px solid var(--b2);box-shadow:0 -26px 70px rgba(0,0,0,.60);overflow-y:auto;animation:mu .22s cubic-bezier(.25,.85,.45,1.0);}
.mHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;}
.mTitle{font-family:'DM Serif Display',serif;font-size:22px;}
.mTitle.sl{background:linear-gradient(90deg,var(--moon2),var(--moon));-webkit-background-clip:text;background-clip:text;color:transparent;}
.mTitle.fe{background:linear-gradient(90deg,var(--feed2),var(--feed));-webkit-background-clip:text;background-clip:text;color:transparent;}
.mTitle.fo{background:linear-gradient(90deg,var(--food2),var(--food));-webkit-background-clip:text;background-clip:text;color:transparent;}
.closeX{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mu);cursor:pointer;user-select:none;border:1px solid var(--b2);background:rgba(255,255,255,.05);}
.closeX:active{background:rgba(255,255,255,.10);}

/* clock */
.clockBox{border-radius:20px;border:1px solid var(--b2);background:rgba(255,255,255,.04);padding:14px;margin-bottom:14px;}
.clockRow{display:flex;align-items:center;gap:14px;}
.face{width:104px;height:104px;border-radius:99px;flex-shrink:0;position:relative;background:radial-gradient(circle at 33% 24%,rgba(123,155,255,.18),transparent 52%),var(--surf2);border:1px solid rgba(123,155,255,.20);box-shadow:inset 0 0 0 7px rgba(123,155,255,.06),0 10px 36px rgba(0,0,0,.50);overflow:hidden;}
.fGlass{position:absolute;inset:0;border-radius:99px;background:radial-gradient(ellipse 68% 48% at 28% 18%,rgba(255,255,255,.14),transparent 58%);pointer-events:none;}
.fTicks{position:absolute;inset:7px;border-radius:99px;background:conic-gradient(from -90deg,rgba(255,255,255,.38) 0 1.4deg,transparent 1.4deg 30deg,rgba(255,255,255,.38) 30deg 31.4deg,transparent 31.4deg 60deg,rgba(255,255,255,.38) 60deg 61.4deg,transparent 61.4deg 90deg,rgba(255,255,255,.38) 90deg 91.4deg,transparent 91.4deg 120deg,rgba(255,255,255,.38) 120deg 121.4deg,transparent 121.4deg 150deg,rgba(255,255,255,.38) 150deg 151.4deg,transparent 151.4deg 180deg,rgba(255,255,255,.38) 180deg 181.4deg,transparent 181.4deg 210deg,rgba(255,255,255,.38) 210deg 211.4deg,transparent 211.4deg 240deg,rgba(255,255,255,.38) 240deg 241.4deg,transparent 241.4deg 270deg,rgba(255,255,255,.38) 270deg 271.4deg,transparent 271.4deg 300deg,rgba(255,255,255,.38) 300deg 301.4deg,transparent 301.4deg 330deg,rgba(255,255,255,.38) 330deg 331.4deg,transparent 331.4deg 360deg);mask:radial-gradient(circle,transparent 0 68%,#000 71% 100%);-webkit-mask:radial-gradient(circle,transparent 0 68%,#000 71% 100%);opacity:.55;}
.hnd{position:absolute;left:50%;top:50%;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(0deg);border-radius:99px;}
.hnd.h{width:4px;height:26px;background:linear-gradient(180deg,rgba(240,242,250,.92),rgba(240,242,250,.28));}
.hnd.m{width:3px;height:34px;background:linear-gradient(180deg,var(--moon),rgba(123,155,255,.22));}
.hnd.s{width:2px;height:40px;background:linear-gradient(180deg,var(--gold),rgba(200,168,108,.28));}
.cpin{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);border-radius:99px;background:var(--gold);border:1px solid rgba(200,168,108,.35);}
.faceKick{animation:fk .11s ease-out;}
@keyframes fk{0%{transform:rotate(0)scale(1);}40%{transform:rotate(-.3deg)scale(1.004);}100%{transform:rotate(0)scale(1);}}
.digCol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.digTime{font-family:'DM Serif Display',serif;font-size:36px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:linear-gradient(90deg,var(--moon2),var(--moon));-webkit-background-clip:text;background-clip:text;color:transparent;}
.digTime.fe{background:linear-gradient(90deg,var(--feed2),var(--feed));-webkit-background-clip:text;background-clip:text;color:transparent;}
.digSub{font-size:11px;color:var(--mu);text-align:right;line-height:1.4;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* form */
.fg{margin-top:13px;}
.fl{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu2);margin-bottom:7px;}
.ftx{width:100%;min-height:76px;padding:11px;border-radius:14px;border:1px solid var(--b2);background:rgba(255,255,255,.05);color:var(--txt);font-size:14px;resize:vertical;font-family:inherit;outline:none;}
.ftx:focus{border-color:rgba(123,155,255,.38);box-shadow:0 0 0 3px rgba(123,155,255,.09);}
.fin{width:100%;height:48px;padding:11px;border-radius:14px;border:1px solid var(--b2);background:rgba(255,255,255,.05);color:var(--txt);font-size:14px;font-family:inherit;outline:none;}
.fin:focus{border-color:rgba(123,155,255,.38);box-shadow:0 0 0 3px rgba(123,155,255,.09);}
.togRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.tog{flex:1 1 90px;min-width:90px;padding:10px;border-radius:13px;border:1px solid var(--b2);background:rgba(255,255,255,.05);color:rgba(240,242,250,.82);font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:all .12s;min-height:42px;}
.tog:active{transform:scale(.96);}
.tog.on{background:rgba(255,143,171,.15);border-color:rgba(255,143,171,.28);color:var(--feed2);}

/* buttons */
.btn{width:100%;min-height:54px;border:none;border-radius:17px;cursor:pointer;user-select:none;font-size:15px;font-weight:700;letter-spacing:.01em;transition:transform .12s,filter .12s;overflow:hidden;position:relative;}
.btn:active{transform:scale(.985);filter:brightness(.97);}
.btn.sl{background:linear-gradient(105deg,var(--moon2),#5b7bff);color:#030812;box-shadow:0 12px 36px rgba(123,155,255,.22);}
.btn.fe{background:linear-gradient(105deg,var(--feed2),#ff5e80);color:#140610;box-shadow:0 12px 36px rgba(255,143,171,.22);}
.btn.st{background:linear-gradient(105deg,var(--orn),#ff5f20);color:#140a02;box-shadow:0 12px 36px rgba(255,154,92,.18);}
.btn.gr{background:linear-gradient(105deg,var(--grn),#28ad7e);color:#041109;box-shadow:0 12px 36px rgba(78,201,160,.18);}
.btn.fo{background:linear-gradient(105deg,var(--food2),var(--food));color:#161003;box-shadow:0 12px 36px rgba(244,201,93,.20);}
.btn.nt{background:rgba(255,255,255,.09);border:1px solid var(--b2);color:var(--txt);}
.g10{height:10px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="hdr">
    <div class="hdrTop">
      <div class="wordmark">Norian</div>
      <div class="hdrPill">Baby tracker</div>
    </div>
    <div class="statRow">
      <div class="stat">
        <div class="statDot sl"></div>
        <div class="statInfo">
          <div class="statLbl">Zadnji san</div>
          <div class="statVal" id="pillSleep">–</div>
        </div>
      </div>
      <div class="stat">
        <div class="statDot fe"></div>
        <div class="statInfo">
          <div class="statLbl">Zadnje hranjenje</div>
          <div class="statVal" id="pillFeed">–</div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <div class="hero">
    <div class="heroIn">
      <div class="heroBRow">
        <div class="heroTag" id="heroTag">STATUS</div>
        <div class="liveDot" id="liveDot" style="display:none;"></div>
      </div>
      <div class="heroMain" id="heroMain">–</div>
      <div class="heroSub" id="heroSub">–</div>
      <div class="ctaRow">
        <div class="cta sc" id="openSleep">
          <div class="ctaIco">🌙</div>
          <div class="ctaTxt"><div class="lbl">Spavanje</div><div class="sub" id="ctaSleepSub">Dodaj</div></div>
          <div class="ctaArr" id="ctaSleepArr">→</div>
        </div>
        <div class="cta fc" id="openFeed">
          <div class="ctaIco">🍼</div>
          <div class="ctaTxt"><div class="lbl">Hranjenje</div><div class="sub" id="ctaFeedSub">Dodaj</div></div>
          <div class="ctaArr" id="ctaFeedArr">→</div>
        </div>
        <div class="cta fd" id="openFood">
          <div class="ctaIco">🥣</div>
          <div class="ctaTxt"><div class="lbl">Hrana</div><div class="sub">Dodaj obrok</div></div>
          <div class="ctaArr">→</div>
        </div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="secHead">
      <div class="secTitle" id="secTitle">Posljednje</div>
      <div class="secLink" id="toggleHistory">Historija</div>
    </div>
    <div class="tabs" id="tabStrip" style="display:none;">
      <div class="tabBtn on" data-t="sleep">🌙 Spavanje</div>
      <div class="tabBtn ft" data-t="feed">🍼 Hranjenje</div>
      <div class="tabBtn fo" data-t="food">🥣 Hrana</div>
    </div>
    <div class="list" id="list"></div>
  </div>

</div>

<div class="nav">
  <div class="navIn">
    <div class="navItem on" id="navHome"><div class="navIco">🏠</div><div class="navLbl">Početna</div></div>
    <div class="navItem" id="navHistory"><div class="navIco">📜</div><div class="navLbl">Historija</div></div>
    <div class="navItem" id="navSleep"><div class="navIco">🌙</div><div class="navLbl">Spavanje</div></div>
    <div class="navItem fn" id="navFeed"><div class="navIco">🍼</div><div class="navLbl">Hranjenje</div></div>
    <div class="navItem fo" id="navFood"><div class="navIco">🥣</div><div class="navLbl">Hrana</div></div>
  </div>
</div>

<!-- SLEEP MODAL -->
<div class="modal" id="sleepModal">
  <div class="sheet">
    <div class="mHead"><div class="mTitle sl">Spavanje</div><div class="closeX" data-close="sleepModal">×</div></div>
    <div class="clockBox" id="sleepClockBox" style="display:none;">
      <div class="clockRow">
        <div class="face" id="sleepFace">
          <div class="fTicks"></div>
          <div class="hnd h" id="sleepH"></div><div class="hnd m" id="sleepM"></div><div class="hnd s" id="sleepS"></div>
          <div class="cpin"></div><div class="fGlass"></div>
        </div>

<script>
const KA="babyActivities",KS="activeSleep",KF="activeFeeding";
const SUP=new Set(["sleep","feeding","food"]);
let acts=sP(localStorage.getItem(KA)||"[]",[]);
let aSleep=sP(localStorage.getItem(KS)||"null",null);
let aFeed=sP(localStorage.getItem(KF)||"null",null);
let isHist=false,hTab="sleep",selB=null,selLike=null,eId=null,eB=null,eLike=null,lastSec=null;
normAll();

function sP(j,f){try{return JSON.parse(j);}catch{return f;}}
function uid(){return"a_"+Math.random().toString(16).slice(2)+"_"+Date.now().toString(16);}
function p2(n){return String(n).padStart(2,"0");}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");}
function isoMs(i){const t=new Date(i).getTime();return Number.isFinite(t)?t:null;}
function msISO(m){return new Date(m).toISOString();}
function hms(ms){const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return`${p2(h)}:${p2(m)}:${p2(s)}`;}
function hm(ms){const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60);return h>0?`${h}h ${m}m`:`${m}m`;}
function ago(ms){
  let d=Date.now()-ms;if(d<0)d=0;let s=Math.floor(d/1000);
  const dy=Math.floor(s/86400);s-=dy*86400;const hr=Math.floor(s/3600);s-=hr*3600;const mi=Math.floor(s/60);s-=mi*60;
  if(dy>0)return`Prije ${dy}d ${hr}h ${mi}m`;if(hr>0)return`Prije ${hr}h ${mi}m ${p2(s)}s`;if(mi>0)return`Prije ${mi}m ${p2(s)}s`;return s<=1?"Upravo":`Prije ${s}s`;
}
function relT(ms){
  const d=new Date(ms),now=new Date();now.setHours(0,0,0,0);const th=new Date(ms);th.setHours(0,0,0,0);
  const df=Math.round((now-th)/86400000);const t=`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
  if(df===0)return`Danas ${t}`;if(df===1)return`Jučer ${t}`;if(df>1)return`Prije ${df}d ${t}`;return t;
}
function dKey(ms){const d=new Date(ms);return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function dLbl(k){
  const[y,m,d]=k.split("-").map(Number);
  const dt=new Date(`${y}-${p2(m)}-${p2(d)}T00:00:00`);
  const now=new Date();now.setHours(0,0,0,0);const yest=new Date(now);yest.setDate(yest.getDate()-1);
  if(dt.getTime()===now.getTime())return"Danas";if(dt.getTime()===yest.getTime())return"Jučer";
  const df=Math.round((now-dt)/86400000);if(df>1)return`Prije ${df} dana`;return`${p2(d)}.${p2(m)}.${y}`;
}
function dtL(ms){const d=new Date(ms);return`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;}
function fromDL(v){const t=new Date(v).getTime();return Number.isFinite(t)?t:null;}
function saveA(){localStorage.setItem(KA,JSON.stringify(acts));}
function saveAct(){
  if(aSleep)localStorage.setItem(KS,JSON.stringify(aSleep));else localStorage.removeItem(KS);
  if(aFeed)localStorage.setItem(KF,JSON.stringify(aFeed));else localStorage.removeItem(KF);
}
function normAct(a){
  if(!a||!a.type)return null;if(!a.id)a.id=uid();
  if(a.type==="awake")a.type="sleep";if(!SUP.has(a.type))return a;
  if(typeof a.startMs!=="number"){const s=isoMs(a.time||a.startIso||a.startTime);if(s)a.startMs=s;}
  if(typeof a.endMs!=="number"){const e=isoMs(a.endTime||a.endIso||a.end);if(e)a.endMs=e;}
  if((!a.endMs||a.endMs<=a.startMs)&&a.startMs&&a.duration!=null){
    if(a.type==="sleep"){const h=Number(a.duration);if(Number.isFinite(h)&&h>0)a.endMs=a.startMs+Math.round(h*3600000);}
    else{const m=Number(a.duration);if(Number.isFinite(m)&&m>0)a.endMs=a.startMs+Math.round(m*60000);}
  }
  if(a.startMs&&!a.startIso)a.startIso=msISO(a.startMs);if(a.endMs&&!a.endIso)a.endIso=msISO(a.endMs);
  if(a.notes==null)a.notes="";if(a.type==="feeding"&&!a.breast)a.breast=null;if(a.type==="food"){if(!a.foodName)a.foodName="";if(!a.liked)a.liked=null;if(a.startMs&&!a.endMs)a.endMs=a.startMs;}if(!a.timestamp)a.timestamp=Date.now();return a;
}
function normSl(x){if(!x)return null;if(typeof x.startMs!=="number"){const s=isoMs(x.startIso);if(s)x.startMs=s;}if(x.startMs&&!x.startIso)x.startIso=msISO(x.startMs);return x.startMs?x:null;}
function normFe(x){if(!x)return null;if(typeof x.startMs!=="number"){const s=isoMs(x.startIso);if(s)x.startMs=s;}if(x.startMs&&!x.startIso)x.startIso=msISO(x.startMs);if(!x.breast)x.breast=null;return x.startMs?x:null;}
function normAll(){acts=Array.isArray(acts)?acts.map(normAct).filter(Boolean):[];aSleep=normSl(aSleep);aFeed=normFe(aFeed);saveA();saveAct();}

function bStr(b){return b==="left"?"Lijeva":b==="right"?"Desna":b==="both"?"Obje":"–";}
function titleFor(a){if(a.type==="sleep")return"Spavanje";if(a.type==="feeding")return`Hranjenje — ${bStr(a.breast)}`;return a.foodName||"Hrana";}
function detFor(a){
  const s=relT(a.startMs),e=relT(a.endMs),dur=hms(a.endMs-a.startMs),n=a.notes?` • ${esc(a.notes)}`:"";
  if(a.type==="sleep")return`Početak: ${s} • Kraj: ${e} • Trajanje: ${dur}${n}`;
  if(a.type==="feeding")return`Početak: ${s} • Kraj: ${e} • Trajanje: ${dur} • Dojka: ${bStr(a.breast)}${n}`;
  return`Vrijeme: ${s} • ${a.liked==="yes"?"Svidjelo mu se":"Nije mu se svidjelo"}${n}`;
}
function cardH(a){return`<div class="card"><div class="cardIco">${a.type==="sleep"?"🌙":a.type==="feeding"?"🍼":"🥣"}</div><div class="cardBody"><div class="cardTitle">${esc(titleFor(a))}</div><div class="cardDesc">${detFor(a)}</div><div class="rowBtns"><button class="smBtn" data-edit="${a.id}">Uredi</button><button class="smBtn danger" data-del="${a.id}">Obriši</button></div></div><div class="cardMeta">${ago(a.endMs||a.startMs)}</div></div>`;}
function liveH(type){
  if(type==="sleep"&&aSleep){const el=Date.now()-aSleep.startMs;return`<div class="card"><div class="cardIco">🌙</div><div class="cardBody"><div class="cardTitle">Spavanje u toku</div><div class="cardDesc">Počeo: ${relT(aSleep.startMs)} • Traje: ${hms(el)}</div></div><div class="cardMeta">Sada</div></div>`;}
  if(type==="feeding"&&aFeed){const el=Date.now()-aFeed.startMs;return`<div class="card"><div class="cardIco">🍼</div><div class="cardBody"><div class="cardTitle">Hranjenje u toku — ${bStr(aFeed.breast)}</div><div class="cardDesc">Počelo: ${relT(aFeed.startMs)} • Traje: ${hms(el)}</div></div><div class="cardMeta">Sada</div></div>`;}
  return"";
}
function updP(){
  const ls=acts.filter(a=>a.type==="sleep"&&a.endMs).sort((a,b)=>b.endMs-a.endMs)[0];
  const lf=acts.filter(a=>a.type==="feeding"&&a.endMs).sort((a,b)=>b.endMs-a.endMs)[0];
  const lfd=acts.filter(a=>a.type==="food"&&a.startMs).sort((a,b)=>b.startMs-a.startMs)[0];
  document.getElementById("pillSleep").textContent=ls?ago(ls.endMs):"–";
  document.getElementById("pillFeed").textContent=lf?ago(lf.endMs):"–";
  document.getElementById("pillFood").textContent=lfd?ago(lfd.startMs):"–";
}
function updH(){
  const main=document.getElementById("heroMain"),sub=document.getElementById("heroSub"),tag=document.getElementById("heroTag"),dot=document.getElementById("liveDot");
  const css=document.getElementById("ctaSleepSub"),csa=document.getElementById("ctaSleepArr"),cfs=document.getElementById("ctaFeedSub"),cfa=document.getElementById("ctaFeedArr");
  css.textContent="Dodaj";csa.textContent="→";cfs.textContent="Dodaj";cfa.textContent="→";
  if(aSleep){tag.textContent="SPAVA";tag.className="heroTag sl";dot.style.display="block";main.textContent=`Spava • ${hms(Date.now()-aSleep.startMs)}`;sub.textContent=`Zaspao: ${relT(aSleep.startMs)} • ${ago(aSleep.startMs)}`;css.textContent="Zaustavi";csa.textContent="STOP";return;}
  if(aFeed){tag.textContent="JEDE";tag.className="heroTag fe";dot.style.display="block";main.textContent=`Jede (${bStr(aFeed.breast)}) • ${hms(Date.now()-aFeed.startMs)}`;sub.textContent=`Počelo: ${relT(aFeed.startMs)} • ${ago(aFeed.startMs)}`;cfs.textContent="Zaustavi";cfa.textContent="STOP";return;}
  tag.textContent="STATUS";tag.className="heroTag";dot.style.display="none";
  const ls=acts.filter(a=>a.type==="sleep"&&a.endMs).sort((a,b)=>b.endMs-a.endMs)[0];
  if(ls){main.textContent=`Zadnji san završio ${ago(ls.endMs)}`;sub.textContent=`Trajao: ${hms(ls.endMs-ls.startMs)}`;}else{main.textContent="Nema zapisa";sub.textContent="Dodaj prvi unos →";}
}
function updL(){
  const el=document.getElementById("list"),title=document.getElementById("secTitle"),tgl=document.getElementById("toggleHistory"),strip=document.getElementById("tabStrip");
  if(!isHist){
    title.textContent="Posljednje";tgl.textContent="Historija";strip.style.display="none";
    const b=[];if(aSleep)b.push(liveH("sleep"));if(aFeed)b.push(liveH("feeding"));
    const ls=acts.filter(a=>a.type==="sleep"&&a.endMs).sort((a,b)=>b.endMs-a.endMs)[0];
    const lf=acts.filter(a=>a.type==="feeding"&&a.endMs).sort((a,b)=>b.endMs-a.endMs)[0];
    const lfd=acts.filter(a=>a.type==="food"&&a.startMs).sort((a,b)=>b.startMs-a.startMs)[0];
    if(!aSleep&&ls)b.push(cardH(ls));if(!aFeed&&lf)b.push(cardH(lf));if(lfd)b.push(cardH(lfd));
    el.innerHTML=b.length?b.join(""):`<div class="empty">Nema aktivnosti.</div>`;return;
  }
  title.textContent="Historija";tgl.textContent="Posljednje";strip.style.display="flex";
  document.querySelectorAll(".tabBtn").forEach(t=>{t.classList.toggle("on",t.dataset.t===hTab);});
  const type=hTab==="sleep"?"sleep":hTab==="feed"?"feeding":"food";
  const sorted=acts.filter(a=>a.type===type&&a.startMs&&a.endMs).sort((a,b)=>b.startMs-a.startMs);
  if(!sorted.length){el.innerHTML=`<div class="empty">Nema zapisa.</div>`;return;}
  const groups={};for(const a of sorted){const k=dKey(a.startMs);(groups[k]||=[]).push(a);}
  const keys=Object.keys(groups).sort((a,b)=>a<b?1:-1);
  el.innerHTML=keys.map(k=>{
    const items=groups[k];
    const badge=type==="sleep"?`<span class="dayBadge">Ukupno: ${hm(items.reduce((s,a)=>s+(a.endMs-a.startMs),0))}</span>`:type==="feeding"?`<span class="dayBadge fb">${items.length}× hranjenje</span>`:`<span class="dayBadge" style="background:rgba(244,201,93,.10);color:var(--food2);border-color:rgba(244,201,93,.20);">${items.length}× obrok</span>`;
    return`<div class="dayGroup"><div class="dayHdr"><div class="dayLabel">${dLbl(k)}</div><div class="dayMeta">${badge}<span class="dayCount">${items.length} zapisa</span></div></div><div class="dayItems">${items.map(cardH).join("")}</div></div>`;
  }).join("");
}
function updAll(){updP();updH();updL();}

function openM(id){document.getElementById(id).classList.add("active");if(id==="sleepModal")pSleep();if(id==="feedModal")pFeed();if(id==="foodModal")pFood();}
function closeM(id){document.getElementById(id).classList.remove("active");}
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeM(m.id);}));
document.querySelectorAll("[data-close]").forEach(x=>x.addEventListener("click",()=>closeM(x.dataset.close)));

function setH(H,M,S,ms){const t=Math.max(0,Math.floor(ms/1000)),s=t%60,m=Math.floor(t/60)%60,h=Math.floor(t/3600)%12;H.style.transform=`translate(-50%,-100%) rotate(${h*30+m*.5}deg)`;M.style.transform=`translate(-50%,-100%) rotate(${m*6+s*.1}deg)`;S.style.transform=`translate(-50%,-100%) rotate(${s*6}deg)`;}
function kick(id){const el=document.getElementById(id);if(!el)return;el.classList.remove("faceKick");void el.offsetWidth;el.classList.add("faceKick");}

function pSleep(){
  if(aSleep){document.getElementById("sleepClockBox").style.display="block";document.getElementById("sleepStart").style.display="none";document.getElementById("sleepStop").style.display="block";}
  else{document.getElementById("sleepClockBox").style.display="none";document.getElementById("sleepStart").style.display="block";document.getElementById("sleepStop").style.display="none";document.getElementById("sleepNotes").value="";}
}
document.getElementById("sleepStart").addEventListener("click",()=>{if(aSleep)return;const ms=Date.now();aSleep={startMs:ms,startIso:new Date(ms).toISOString()};saveAct();pSleep();updAll();});
document.getElementById("sleepStop").addEventListener("click",()=>{
  if(!aSleep)return;const endMs=Date.now();
  const a=normAct({id:uid(),type:"sleep",time:aSleep.startIso,endTime:new Date(endMs).toISOString(),duration:(endMs-aSleep.startMs)/3600000,notes:document.getElementById("sleepNotes").value||"",timestamp:Date.now()});
  acts.push(a);aSleep=null;saveA();saveAct();closeM("sleepModal");updAll();
});

function setBreast(b){selB=b;document.querySelectorAll("#breastRow .tog").forEach(btn=>btn.classList.toggle("on",btn.dataset.b===b));}
document.querySelectorAll("#breastRow .tog").forEach(btn=>btn.addEventListener("click",()=>setBreast(btn.dataset.b)));
function pFeed(){
  if(aFeed){document.getElementById("feedClockBox").style.display="block";document.getElementById("feedStart").style.display="none";document.getElementById("feedStop").style.display="block";setBreast(aFeed.breast);}
  else{document.getElementById("feedClockBox").style.display="none";document.getElementById("feedStart").style.display="block";document.getElementById("feedStop").style.display="none";setBreast(null);document.getElementById("feedNotes").value="";}
}
document.getElementById("feedStart").addEventListener("click",()=>{if(aFeed)return;if(!selB)return alert("Odaberi dojku.");const ms=Date.now();aFeed={startMs:ms,startIso:new Date(ms).toISOString(),breast:selB};saveAct();pFeed();updAll();});
document.getElementById("feedStop").addEventListener("click",()=>{
  if(!aFeed)return;const endMs=Date.now();const dur=Math.round((endMs-aFeed.startMs)/60000);if(dur<=0)return alert("Greška u vremenima.");
  const a=normAct({id:uid(),type:"feeding",time:aFeed.startIso,endTime:new Date(endMs).toISOString(),breast:aFeed.breast,duration:dur,notes:document.getElementById("feedNotes").value||"",timestamp:Date.now()});
  acts.push(a);aFeed=null;saveA();saveAct();closeM("feedModal");updAll();
});


function setFoodLike(v){selLike=v;document.querySelectorAll("#foodLikeRow .tog").forEach(btn=>btn.classList.toggle("on",btn.dataset.like===v));}
document.querySelectorAll("#foodLikeRow .tog").forEach(btn=>btn.addEventListener("click",()=>setFoodLike(btn.dataset.like)));
function pFood(){
  document.getElementById("foodName").value="";
  document.getElementById("foodTime").value=dtL(Date.now());
  document.getElementById("foodNotes").value="";
  setFoodLike(null);
}
document.getElementById("foodSave").addEventListener("click",()=>{
  const foodName=document.getElementById("foodName").value.trim();
  const startMs=fromDL(document.getElementById("foodTime").value);
  if(!foodName)return alert("Unesi šta je jeo.");
  if(!startMs)return alert("Unesi vrijeme obroka.");
  if(!selLike)return alert("Odaberi da li mu se svidjelo.");
  acts.push(normAct({id:uid(),type:"food",foodName,liked:selLike,startMs,endMs:startMs,startIso:msISO(startMs),endIso:msISO(startMs),notes:document.getElementById("foodNotes").value||"",timestamp:Date.now()}));
  saveA();closeM("foodModal");updAll();
});

function openEdit(id){
  const a=acts.find(x=>x&&x.id===id);if(!a)return;eId=id;
  document.getElementById("editStart").value=a.startMs?dtL(a.startMs):"";document.getElementById("editEnd").value=a.endMs?dtL(a.endMs):"";document.getElementById("editNotes").value=a.notes||"";
  document.getElementById("editBreastWrap").style.display=a.type==="feeding"?"block":"none";
  document.getElementById("editFoodWrap").style.display=a.type==="food"?"block":"none";
  if(a.type==="feeding"){eB=a.breast||null;document.querySelectorAll("#editBreastRow .tog").forEach(b=>b.classList.toggle("on",b.dataset.b===eB));}else eB=null;
  if(a.type==="food"){document.getElementById("editEnd").closest(".fg").style.display="none";document.getElementById("editFoodName").value=a.foodName||"";eLike=a.liked||null;document.querySelectorAll("#editFoodLikeRow .tog").forEach(b=>b.classList.toggle("on",b.dataset.like===eLike));}
  else{document.getElementById("editEnd").closest(".fg").style.display="block";eLike=null;}
  openM("editModal");
}
document.querySelectorAll("#editBreastRow .tog").forEach(btn=>btn.addEventListener("click",()=>{eB=btn.dataset.b;document.querySelectorAll("#editBreastRow .tog").forEach(b=>b.classList.remove("on"));btn.classList.add("on");}));
document.querySelectorAll("#editFoodLikeRow .tog").forEach(btn=>btn.addEventListener("click",()=>{eLike=btn.dataset.like;document.querySelectorAll("#editFoodLikeRow .tog").forEach(b=>b.classList.remove("on"));btn.classList.add("on");}));
document.getElementById("editSave").addEventListener("click",()=>{
  if(!eId)return;const a=acts.find(x=>x&&x.id===eId);if(!a)return;
  const s=fromDL(document.getElementById("editStart").value),e=a.type==="food"?s:fromDL(document.getElementById("editEnd").value);
  if(!s||!e)return alert(a.type==="food"?"Unesi vrijeme obroka.":"Unesi početak i kraj.");if(a.type!=="food"&&e<=s)return alert("Kraj ne može biti prije početka.");
  a.startMs=s;a.endMs=e;a.startIso=msISO(s);a.endIso=msISO(e);a.time=a.startIso;a.endTime=a.endIso;a.notes=document.getElementById("editNotes").value||"";
  if(a.type==="sleep"){a.duration=(e-s)/3600000;}
  else if(a.type==="feeding"){if(!eB)return alert("Odaberi dojku.");a.breast=eB;a.duration=Math.round((e-s)/60000);if(a.duration<=0)return alert("Greška u vremenima.");}
  else{const name=document.getElementById("editFoodName").value.trim();if(!name)return alert("Unesi šta je jeo.");if(!eLike)return alert("Odaberi da li mu se svidjelo.");a.foodName=name;a.liked=eLike;}
  normAll();saveA();closeM("editModal");updAll();
});
function delAct(id){const i=acts.findIndex(a=>a&&a.id===id);if(i<0)return;if(!confirm("Obrisati zapis?"))return;acts.splice(i,1);saveA();updAll();}
document.addEventListener("click",e=>{const b1=e.target.closest("[data-edit]");if(b1)return openEdit(b1.dataset.edit);const b2=e.target.closest("[data-del]");if(b2)return delAct(b2.dataset.del);});

document.querySelectorAll(".tabBtn").forEach(t=>t.addEventListener("click",()=>{hTab=t.dataset.t;updL();}));

function setNav(id){document.querySelectorAll(".navItem").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");}
document.getElementById("navHome").addEventListener("click",()=>{isHist=false;setNav("navHome");updAll();window.scrollTo({top:0,behavior:"instant"});});
document.getElementById("navHistory").addEventListener("click",()=>{isHist=true;setNav("navHistory");updAll();window.scrollTo({top:0,behavior:"instant"});});
document.getElementById("navSleep").addEventListener("click",()=>openM("sleepModal"));
document.getElementById("navFeed").addEventListener("click",()=>openM("feedModal"));
document.getElementById("navFood").addEventListener("click",()=>openM("foodModal"));
document.getElementById("toggleHistory").addEventListener("click",()=>{isHist=!isHist;setNav(isHist?"navHistory":"navHome");updAll();window.scrollTo({top:0,behavior:"instant"});});
document.getElementById("openSleep").addEventListener("click",()=>openM("sleepModal"));
document.getElementById("openFeed").addEventListener("click",()=>openM("feedModal"));
document.getElementById("openFood").addEventListener("click",()=>openM("foodModal"));

function tick(){
  acts=sP(localStorage.getItem(KA)||"[]",[]);aSleep=sP(localStorage.getItem(KS)||"null",null);aFeed=sP(localStorage.getItem(KF)||"null",null);normAll();updP();updH();updL();
  const nowSec=Math.floor(Date.now()/1000),isNew=lastSec===null||nowSec!==lastSec;if(isNew)lastSec=nowSec;
  if(document.getElementById("sleepModal").classList.contains("active")&&aSleep){
    const el=Date.now()-aSleep.startMs;document.getElementById("sleepElapsed").textContent=hms(el);document.getElementById("sleepMeta").textContent=`Zaspao: ${relT(aSleep.startMs)} • ${ago(aSleep.startMs)}`;
    setH(document.getElementById("sleepH"),document.getElementById("sleepM"),document.getElementById("sleepS"),el);if(isNew)kick("sleepFace");document.getElementById("sleepClockBox").style.display="block";
  }
  if(document.getElementById("feedModal").classList.contains("active")&&aFeed){
    const el=Date.now()-aFeed.startMs;document.getElementById("feedElapsed").textContent=hms(el);document.getElementById("feedMeta").textContent=`Počelo: ${relT(aFeed.startMs)} • Dojka: ${bStr(aFeed.breast)} • ${ago(aFeed.startMs)}`;
    setH(document.getElementById("feedH"),document.getElementById("feedM"),document.getElementById("feedS"),el);if(isNew)kick("feedFace");document.getElementById("feedClockBox").style.display="block";
  }
}
updAll();pSleep();pFeed();pFood();setInterval(tick,1000);
</script>
